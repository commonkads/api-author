name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, build, test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm run test:ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-results
          path: test-results.xml

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: docker/build-push-action@v7
        with:
          push: false
          tags: api-author:ci
